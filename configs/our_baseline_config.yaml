run:
  experiment_name: baseline-smollm2-360m-fineweb10b
  save_root: ./runs

data:
  streaming_data_path:
    - "1"
    - /tmp/xgram-smollm2-fineweb-cache
    - ./data/fineweb_10b_streaming
  streaming_tokenizer_model: /home/bcjiang/.cache/huggingface/hub/models--HuggingFaceTB--SmolLM2-360M/snapshots/f8027fd0eaeea54caa13c31d31b9fdc459c38b49
  streaming_ckpt_path: ./checkpoints/dataloader.ckpt
  use_token_column: tokens
  text_chunk_size: 4096
  prefetch_queue_size: 16
  pack_method: native:truncate

model:
  # SmolLM2-360M architecture.
  num_layers: 32
  hidden_size: 960
  ffn_hidden_size: 2560
  num_attn_heads: 15
  num_query_groups: 3

training:
  micro_batch_size: 4
  global_batch_size: 512
  train_tokens: 10000000000
  lr: 0.0003

evaluation:
  downstream:
    enabled: false
    eval_interval: 400

embedding_injection: null
